<!DOCTYPE html>
<html data-theme="light" lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Resolve all relative URLs (assets + fetched md/json) against this folder,
       regardless of whether the page URL ends in a trailing slash. -->
  <base href="/luat-nha-o-2023/">
  <title>Luật Nhà ở 2023 (27/2023/QH15) — Tra cứu</title>
  <meta name="description" content="Tra cứu Luật Nhà ở 2023 (27/2023/QH15): tìm theo số điều hoặc từ khóa, chọn điều và sao chép nội dung cho AI.">
  <!-- Markdown renderer (must load before app.js) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Shared design system + utilities -->
  <link rel="stylesheet" href="../style.css">
  <script src="../script.js" defer></script>
  <!-- Reader interactivity -->
  <script src="./app.js" defer></script>
</head>
<body>
  <!-- ===== Sticky site header ===== -->
  <header class="site-header">
    <div class="site-header-inner">
      <a class="back-link" href="../index.html" aria-label="Về trang chủ">← Trang chủ</a>
      <h1 class="site-header-title">Luật Nhà ở 2023 <span class="site-header-code">(27/2023/QH15)</span></h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối">
        <span class="theme-glyph" aria-hidden="true">☾</span>
      </button>
    </div>
  </header>

  <!-- ===== Sticky search bar ===== -->
  <div class="search-bar">
    <div class="search-bar-inner">
      <div class="search-box">
        <input
          id="search-input"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Tìm theo số điều hoặc từ khóa…"
          aria-label="Tìm theo số điều hoặc từ khóa"
          aria-controls="search-results"
          aria-expanded="false">
        <!-- Dropdown of matches, populated at runtime -->
        <div id="search-results" class="search-results" role="listbox" hidden></div>
      </div>
    </div>
  </div>

  <!-- ===== Main reader layout ===== -->
  <div class="reader-layout">
    <!-- Sidebar: chapter navigation (built at runtime) -->
    <aside class="sidebar" aria-label="Mục lục các chương">
      <nav id="chapter-nav" class="chapter-nav">
        <!-- .chap-item rows injected by app.js -->
      </nav>
    </aside>

    <!-- Content: rendered articles -->
    <main class="content">
      <!-- Loading indicator while fetching manifest + chapters -->
      <div id="loading" class="loading-indicator" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span>Đang tải nội dung luật…</span>
      </div>
      <article id="law-content" class="law-content"></article>
    </main>
  </div>

  <!-- ===== Selection toolbar (hidden until >=1 article selected) ===== -->
  <div id="selection-toolbar" class="selection-toolbar" hidden aria-live="polite">
    <div class="selection-toolbar-inner">
      <div class="toolbar-info">
        <span class="toolbar-count">Đã chọn: 0 điều (~0 từ)</span>
        <span class="toolbar-warning" hidden>⚠ Nội dung lớn, có thể vượt context window một số AI</span>
      </div>
      <div class="toolbar-actions">
        <button id="btn-select-chapter" class="btn btn-ghost" type="button">Chọn tất cả chương này</button>
        <button id="btn-select-all" class="btn btn-ghost" type="button">Chọn tất cả</button>
        <button id="btn-deselect-all" class="btn btn-ghost" type="button">Bỏ chọn tất cả</button>
        <button id="btn-copy-links" class="btn btn-secondary" type="button">🔗 Copy links</button>
        <button id="btn-copy-content" class="btn btn-primary" type="button">📋 Copy nội dung</button>
      </div>
    </div>
  </div>

  <!-- ===== Footer (two lines, same as home) ===== -->
  <footer class="site-footer">
    <p>© 2025 luat.dkien.com — Tra cứu văn bản pháp luật.</p>
    <p>Nội dung chỉ mang tính tham khảo; khi trích dẫn pháp lý hãy đối chiếu bản chính thức.</p>
  </footer>
</body>
</html>
